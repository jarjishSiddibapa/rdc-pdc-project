{% extends "base.html" %}
{% block title %}Change Password — {{ app_name }}{% endblock %}
{% block page_title %}Change Password{% endblock %}

{% block content %}
<div class="content-card" style="max-width:540px;">
    <div class="card-header">
        <h2 class="card-title">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            Change Password
        </h2>
    </div>
    <form method="POST" class="form-body">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label for="current_password" class="form-label">Current Password <span class="required">*</span></label>
            <input type="password" id="current_password" name="current_password" class="form-input" required>
        </div>

        <div class="form-group">
            <label for="new_password" class="form-label">New Password <span class="required">*</span></label>
            <input type="password" id="new_password" name="new_password" class="form-input" minlength="8" required>
            <small class="form-hint">Minimum 8 characters</small>
        </div>

        <div class="form-group">
            <label for="confirm_password" class="form-label">Confirm New Password <span class="required">*</span></label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-input" minlength="8" required>
        </div>

        <div class="form-actions">
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Update Password</button>
        </div>
    </form>
</div>
{% endblock %}
