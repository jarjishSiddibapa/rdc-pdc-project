{% extends "base.html" %}
{% block title %}{{ 'Edit' if bank else 'New' }} Bank — {{ app_name }}{% endblock %}
{% block page_title %}{{ 'Edit Bank' if bank else 'Add Bank' }}{% endblock %}

{% block content %}
<div class="content-card" style="max-width:540px;">
    <form method="POST" class="form-body">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="bank_name" class="form-label">Bank Name <span class="required">*</span></label>
            <input type="text" id="bank_name" name="bank_name" class="form-input" value="{{ bank.bank_name if bank else '' }}" required>
        </div>
        <div class="form-actions">
            <a href="{{ url_for('admin.banks') }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">{{ 'Update' if bank else 'Create' }} Bank</button>
        </div>
    </form>
</div>
{% endblock %}
